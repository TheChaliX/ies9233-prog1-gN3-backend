spring.application.name=demo
#Proyecto Programacion 1

server.port=8080

# Base H2 en memoria: se recrea (y se vuelve a cargar con datos de ejemplo) en cada arranque.
spring.datasource.url=jdbc:h2:mem:torneo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera las tablas a partir de las entidades (con sus UNIQUE, CHECK y FK).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola de la base: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:torneo)
spring.h2.console.enabled=true

# Datos de ejemplo (Premier League 2026-27) para poder probar la app. Poner en false para arrancar vacío.
app.seed=true
